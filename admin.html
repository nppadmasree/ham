<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAM Admin</title><style>body{font:16px system-ui;margin:24px;background:#fff8f2;color:#42143c}input,select,button{padding:12px;margin:5px;border:1px solid #ccc;border-radius:8px;font:inherit}button{background:#a40859;color:white;cursor:pointer}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}img{width:54px;height:54px;object-fit:cover;border-radius:8px}#wrap{overflow:auto}</style><a href="index.html">Campaign home</a><h1>HAM Admin Dashboard</h1><form id="login"><input id="email" type="email" required placeholder="Admin email"><input id="password" type="password" required placeholder="Admin password"><button>Login</button></form><p id="status"></p><section id="panel" hidden><h2 id="total"></h2><input id="search" placeholder="Search teacher"><select id="filter"></select><button id="refresh">Refresh</button><button id="export">Export CSV</button><button id="logout">Logout</button><div id="wrap"><table><thead><tr><th>Name</th><th>Subdistrict</th><th>Registered</th></tr></thead><tbody id="rows"></tbody></table></div></section><script type="module">
import {firebaseConfig} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,getDocs} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const app=initializeApp(firebaseConfig,'admin'),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);let token='',data=[];async function load(){data=(await getDocs(collection(db,'participants'))).docs.map(d=>{const r=d.data();return {...r,date:r.date?.toDate().toISOString()||''}});let old=$('filter').value;$('filter').replaceChildren(new Option('All subdistricts',''));for(let s of [...new Set(data.map(r=>r.subdistrict))].sort())$('filter').add(new Option(s,s));$('filter').value=old;render()}function filtered(){return data.filter(r=>(!$('filter').value||r.subdistrict===$('filter').value)&&r.name.toLowerCase().includes($('search').value.toLowerCase()))}function render(){let rows=filtered();$('total').textContent=`${data.length} registered • ${rows.length} shown`; $('rows').replaceChildren();for(let r of rows){let tr=$('rows').insertRow();for(let v of [r.name,r.subdistrict,new Date(r.date).toLocaleString()])tr.insertCell().textContent=v}}$('login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);await load();$('login').hidden=true;$('panel').hidden=false;$('password').value='';$('status').textContent=''}catch(e){$('status').textContent=e.message}};$('search').oninput=$('filter').onchange=render;$('refresh').onclick=()=>load().catch(e=>$('status').textContent=e.message);$('logout').onclick=async()=>{await signOut(auth);location.reload()};$('export').onclick=()=>{let esc=v=>'"'+(/^[=+\-@\t\r]/.test(v)?"'":'')+v.replaceAll('"','""')+'"';let csv='\ufeffName,Subdistrict,Registered\n'+filtered().map(r=>[r.name,r.subdistrict,r.date].map(esc).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='HAM-participants.csv';a.click()};</script></html>
