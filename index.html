<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAM Kannur | Campaign</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8f2;color:#30213c;font:16px system-ui,sans-serif}header{background:#75114c;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}a{color:inherit}main{max-width:1000px;margin:auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:28px}section{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 30px #72134c15}h1{font-size:30px;margin:0 0 12px}label{display:block;margin:16px 0 6px;font-weight:600}input:not([type=checkbox]){width:100%;padding:12px;border:1px solid #d8c5cf;border-radius:9px;font:inherit}button{background:#a40859;color:white;border:0;border-radius:10px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;margin-top:12px}button:disabled{opacity:.45}canvas{width:100%;height:auto;border-radius:10px}small{color:#69566a} @media(max-width:700px){main{grid-template-columns:1fr;padding:14px}section{padding:18px}}</style><header><b>HAM • KANNUR 2026</b><a href="admin.html">Admin login</a></header><main><section><h1>ഞാനും പങ്കെടുക്കും</h1><p>Create your personalised conference poster.</p><form id="form" onsubmit="event.preventDefault()"><label for="photo">Your photograph</label><input id="photo" type="file" accept="image/*" required><label>Zoom</label><input id="zoom" type="range" min="1" max="3" step=".05" value="1"><label>Horizontal position</label><input id="px" type="range" min="-1" max="1" step=".05" value="0"><label>Vertical position</label><input id="py" type="range" min="-1" max="1" step=".05" value="0"><label for="name">Teacher name</label><input id="name" maxlength="120" required placeholder="Your full name"><label for="sub">Subdistrict name</label><input id="sub" maxlength="120" required placeholder="Your subdistrict"><p><label><input id="consent" type="checkbox" required> I agree to share my name and subdistrict with HAM organisers for participation records. My photograph stays on my device.</label></p><button id="register">Register & generate poster</button></form><button id="download" disabled>Download PNG</button> <button id="share" disabled>Share poster</button><p id="status" role="status"></p></section><section><canvas id="canvas" width="1056" height="1408"></canvas><small>Live poster preview</small></section></main><script type="module">
let connection;
function connect(){return connection ||= (async()=>{
const [{firebaseConfig},{initializeApp},{getAuth,signInAnonymously},{getFirestore,doc,setDoc,serverTimestamp}]=await Promise.all([import('./firebase-config.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js')]);
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app); await auth.authStateReady(); return {auth,db,signInAnonymously,doc,setDoc,serverTimestamp};
})().catch(e=>{connection=null;throw e})}
const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d'),bg=new Image();let photo=null,ready=false;bg.onload=draw;bg.onerror=()=>{$('status').textContent='Poster image could not load. Check poster.png in GitHub.'};bg.src='poster.png';function portrait(g,x,y,w,h){let s=Math.max(w/photo.width,h/photo.height)*Number($('zoom').value),dw=photo.width*s,dh=photo.height*s;g.drawImage(photo,x+(w-dw)*(1+Number($('px').value))/2,y+(h-dh)*(1+Number($('py').value))/2,dw,dh)}function draw(){if(!bg.complete||!bg.naturalWidth)return;ctx.drawImage(bg,0,0,1056,1408);if(photo){ctx.save();ctx.beginPath();if(ctx.roundRect)ctx.roundRect(329,682,384,365,65);else ctx.rect(329,682,384,365);ctx.clip();portrait(ctx,329,682,384,365);ctx.restore()}ctx.fillStyle='#fffaf1';ctx.fillRect(207,1101,642,108);ctx.textAlign='center';ctx.textBaseline='middle';for(let [v,y,size] of [[$('name').value,1132,38],[$('sub').value,1180,29]]){ctx.font=`bold ${size}px system-ui, sans-serif`;ctx.fillStyle='#471044';ctx.fillText(v,528,y,640)}}function changed(){ready=false;$('download').disabled=$('share').disabled=true;draw()}for(let id of ['name','sub','zoom','px','py'])$(id).oninput=changed;$('photo').onchange=()=>{let f=$('photo').files[0];if(!f)return;let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{photo=im;URL.revokeObjectURL(u);changed()};im.onerror=()=>{$('status').textContent='Choose a valid image';URL.revokeObjectURL(u)};im.src=u};$('form').onsubmit=async e=>{e.preventDefault();if(!photo||!bg.naturalWidth){$('status').textContent='Wait for the poster and photo to load.';return;}$('register').disabled=true;try{const name=$('name').value.trim(),subdistrict=$('sub').value.trim();if(!name||!subdistrict)throw Error('Enter both details');const {auth,db,signInAnonymously,doc,setDoc,serverTimestamp}=await connect();const user=auth.currentUser||(await signInAnonymously(auth)).user;await setDoc(doc(db,'participants',user.uid),{name,subdistrict,date:serverTimestamp()});ready=true;$('download').disabled=$('share').disabled=false;$('status').textContent='Registration successful! Your poster is ready.'}catch(e){$('status').textContent='Registration failed: '+e.message}finally{$('register').disabled=false}};$('download').onclick=()=>{let a=document.createElement('a');a.download='HAM-campaign.png';a.href=c.toDataURL('image/png');a.click()};$('share').onclick=()=>c.toBlob(async b=>{let f=new File([b],'HAM-campaign.png',{type:'image/png'});if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f],title:'ഞാനും പങ്കെടുക്കും'})}catch{}}else $('download').click()});</script></html>
